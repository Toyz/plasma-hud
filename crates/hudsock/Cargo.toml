[package]
name = "hudsock"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QML module org.helba.hud: streams hudprobe's unix socket into QML (cxx-qt)"

[lib]
# The qmldir cxx-qt generates loads `liborg_helba_hud.so`.
name = "org_helba_hud"
crate-type = ["cdylib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"
